<!DOCTYPE html>
<html>
<head>
    <title>PDF Merger</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6795913979907339"
     crossorigin="anonymous"></script>
</head>
<body>
    <h1>PDF Merger</h1>
    <form action="/merge" method="post" enctype="multipart/form-data">
        <label for="pdfs">Select PDFs:</label>
        <input type="file" name="pdfs" id="pdfs" accept="application/pdf" multiple required>
        <br>
        <button type="submit">Merge PDFs</button>
    </form>
</body>
</html>
