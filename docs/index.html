<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF結合</title>
    <meta name="description" content="複数のPDFファイルをブラウザ内で1つに結合。サーバーへのアップロード不要。">
    <meta property="og:title" content="PDF結合">
    <meta property="og:description" content="複数のPDFファイルをブラウザ内で1つに結合。サーバーへのアップロード不要。">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M9 10h8v12H9zM15 10h8l-3 4 3 4h-8z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
    <header class="site-header">
        <span class="site-logo" data-i18n="hero.title">PDF結合</span>
        <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" data-locale="ja" data-i18n="lang.ja" data-i18n-aria="lang.switch.ja" aria-pressed="true">JA</button>
            <button type="button" data-locale="en" data-i18n="lang.en" data-i18n-aria="lang.switch.en" aria-pressed="false">EN</button>
        </div>
    </header>

    <main class="site-main">
        <section class="hero" aria-labelledby="hero-title">
            <h1 id="hero-title" data-i18n="hero.title">PDF結合</h1>
            <p class="subtitle" data-i18n="hero.subtitle">複数のPDFファイルを1つに結合</p>
            <div class="privacy-badge" role="status" data-i18n-aria="privacy.aria">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="11" width="16" height="10" rx="2"></rect>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                </svg>
                <span data-i18n="privacy.badge">ブラウザ内で処理・PDFはサーバーに送信されません</span>
            </div>
        </section>

        <form id="mergeForm" class="card" onsubmit="return false;" aria-labelledby="hero-title">
            <div class="drop-zone" id="dropZone" role="region" data-i18n-aria="dropzone.aria">
                <svg class="drop-zone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="12" y1="18" x2="12" y2="12"></line>
                    <polyline points="9 15 12 12 15 15"></polyline>
                </svg>
                <span class="drop-zone-title" data-i18n="dropzone.title">PDFファイルをここにドラッグ＆ドロップ</span>
                <span class="drop-zone-hint" data-i18n="dropzone.hint">PDFのみ · 最大20件 · ブラウザ内で処理</span>
            </div>

            <input type="file" name="pdfs" id="pdfs" class="visually-hidden"
                   accept="application/pdf" multiple>

            <div class="file-list-section">
                <div class="file-list-empty" id="fileListEmpty">
                    <p class="file-list-empty-title" data-i18n="empty.title">ファイルがまだありません</p>
                    <p class="file-list-empty-hint" data-i18n="empty.hint">「ファイルを選択」から追加するか、上のエリアにドロップしてください</p>
                </div>
                <div class="file-list" id="fileList" aria-live="polite"></div>
            </div>

            <div class="controls">
                <button type="button" class="secondary-button" id="chooseButton" data-i18n="button.choose">ファイルを選択</button>
                <button type="button" class="secondary-button" id="clearButton" data-i18n="button.clear">リストをクリア</button>
                <button type="button" class="primary-button" id="mergeButton" disabled>
                    <span class="spinner" aria-hidden="true"></span>
                    <span class="merge-label" data-i18n="button.merge">PDFを結合</span>
                </button>
            </div>
        </form>

        <section class="status-area" aria-live="polite">
            <p class="status-message" id="statusMessage">ファイルを選択して「PDFを結合」をクリックしてください。</p>
            <div class="progress-container" id="progressContainer" hidden>
                <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            <div class="download-section" id="downloadSection">
                <a class="download-link" id="downloadLink" href="#" download="merged.pdf">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="12" y1="18" x2="12" y2="12"></line>
                        <polyline points="9 15 12 18 15 15"></polyline>
                    </svg>
                    <span data-i18n="download.label">マージ結果をダウンロード</span>
                </a>
                <span class="download-meta" id="downloadMeta"></span>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <a href="https://github.com/T3pp31/pdf_merge_app" target="_blank" rel="noopener noreferrer" data-i18n="footer.github">GitHub で見る</a>
        <p class="footer-note" data-i18n="footer.note">すべての処理はブラウザ内で実行されます</p>
    </footer>

    <script type="module" src="js/ui.js"></script>
</body>
</html>
