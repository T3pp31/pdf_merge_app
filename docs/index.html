<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        /* 全体レイアウト -------------------------------------------------- */
        body {
            background: linear-gradient(135deg, #232526 0%, #414345 100%);
            color: #fff;
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        h1 {
            margin-top: 40px;
            font-size: 2.8rem;
            letter-spacing: 2px;
            font-weight: 700;
            text-shadow: 0 2px 8px #0008;
        }

        /* フォームブロック ------------------------------------------------ */
        form {
            background: rgba(30, 30, 30, 0.95);
            padding: 32px 40px 24px 40px;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 #0006;
            margin: 32px 0 24px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 320px;
        }

        .file-label {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            background: #232526;
            border: 2px dashed #00c6ff;
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .file-label:hover {
            border-color: #0072ff;
        }

        .file-label-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #00c6ff;
            margin-bottom: 8px;
        }

        input[type="file"] {
            margin-bottom: 0;
            color: #fff;
            background: transparent;
            border: none;
            padding: 0;
        }

        button[type="submit"] {
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 2px 8px #0072ff44;
            transition: background 0.2s, transform 0.2s;
        }

        button[type="submit"]:hover:not(:disabled) {
            background: linear-gradient(90deg, #0072ff 0%, #00c6ff 100%);
            transform: translateY(-2px) scale(1.04);
        }

        /* 広告エリア ------------------------------------------------------ */
        .ads {
            margin-top: 32px;
            display: flex;
            flex-direction: row;
            gap: 24px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .ads a {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(30, 30, 30, 0.85);
            border-radius: 12px;
            box-shadow: 0 2px 12px #0072ff33;
            padding: 8px 12px;
            transition: box-shadow 0.2s, transform 0.2s;
        }

        .ads a:hover {
            box-shadow: 0 4px 24px #00c6ff66;
            transform: translateY(-2px) scale(1.04);
        }

        .ads img {
            border-radius: 8px;
            max-width: 100%;
            height: auto;
            display: block;
        }

        .ads-link-text {
            color: #00c6ff;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* レスポンシブ対応 ------------------------------------------------ */
        @media (max-width: 900px) {
            .ads {
                flex-direction: column;
                gap: 18px;
            }
        }

        @media (max-width: 600px) {
            form {
                min-width: 0;
                width: 95vw;
                padding: 18px 4vw 14px 4vw;
            }

            h1 {
                font-size: 2rem;
            }
        }

        /* ドラッグ&ドロップ ------------------------------------------------ */
        .file-label.dragover {
            border-color: #0072ff;
            background: #1a1a2e;
        }

        /* ファイルリスト -------------------------------------------------- */
        .file-list {
            width: 100%;
            display: grid;
            gap: 8px;
            margin-bottom: 12px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(0, 198, 255, 0.07);
            border: 1px solid rgba(0, 198, 255, 0.25);
            border-radius: 10px;
            color: #fff;
        }

        .file-item .file-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .file-item .file-name {
            font-weight: 600;
            font-size: 0.95rem;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #e0e0e0;
        }

        .file-item .file-size {
            font-size: 0.8rem;
            color: #aaa;
        }

        .remove-button {
            background: transparent;
            border: none;
            color: #00c6ff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .remove-button:hover {
            color: #ff4d6d;
        }

        /* ステータスエリア ------------------------------------------------ */
        .status-area {
            background: rgba(30, 30, 30, 0.85);
            border-radius: 14px;
            padding: 16px 24px;
            margin-bottom: 16px;
            min-width: 320px;
            max-width: 520px;
            width: 100%;
            box-sizing: border-box;
        }

        .status-message {
            color: #ccc;
            font-size: 0.97rem;
            margin: 0;
        }

        .status-message.error {
            color: #ff6b6b;
        }

        .status-message.success {
            color: #6bffb8;
        }

        /* ダウンロードリンク ---------------------------------------------- */
        .download-link {
            display: none;
            margin-top: 12px;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .download-link a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 999px;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .download-link a:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.35);
        }

        /* コントロールボタン行 -------------------------------------------- */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }

        .secondary-button {
            background: transparent;
            border: 2px solid #00c6ff;
            color: #00c6ff;
            border-radius: 8px;
            padding: 9px 18px;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .secondary-button:hover {
            background: rgba(0, 198, 255, 0.15);
        }

        button[type="submit"]:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <h1>PDF Merger</h1>

    <form id="mergeForm" onsubmit="return false;">
        <label for="pdfs" class="file-label" id="dropZone">
            <span class="file-label-title">PDFファイルをドラッグ＆ドロップ、または選択</span>
            <input type="file" name="pdfs" id="pdfs"
                   accept="application/pdf" multiple
                   style="display:none;">
        </label>

        <div class="file-list" id="fileList" aria-live="polite"></div>

        <div class="controls">
            <button type="button" class="secondary-button" id="chooseButton">ファイルを選択</button>
            <button type="button" class="secondary-button" id="clearButton">リストをクリア</button>
            <button type="submit" id="mergeButton" disabled>Merge PDFs</button>
        </div>
    </form>

    <div class="status-area">
        <p class="status-message" id="statusMessage">ファイルを選択して「Merge PDFs」をクリックしてください。</p>
        <div class="download-link" id="downloadSection">
            <a id="downloadLink" href="#" download="merged.pdf">&#128196; マージ結果をダウンロード</a>
            <span id="downloadMeta" style="color:#aaa; font-size:0.88rem;"></span>
        </div>
    </div>

    <!-- アフィリエイト広告ブロック -->
    <div class="ads">
        <a href="https://px.a8.net/svt/ejp?a8mat=2ZL5EP+1WGW4A+0K+10A5LT" rel="nofollow">
            <img border="0" width="234" height="60" alt="" src="https://www22.a8.net/svt/bgt?aid=180705697115&wid=002&eno=01&mid=s00000000002006094000&mc=1">
        </a>
        <img border="0" width="1" height="1" src="https://www19.a8.net/0.gif?a8mat=2ZL5EP+1WGW4A+0K+10A5LT" alt="">

        <a href="https://px.a8.net/svt/ejp?a8mat=4519B8+ASS3KQ+4EKC+631SX" rel="nofollow">
            <img border="0" width="600" height="100" alt="" src="https://www22.a8.net/svt/bgt?aid=250321508653&wid=002&eno=01&mid=s00000020550001022000&mc=1">
        </a>
        <img border="0" width="1" height="1" src="https://www10.a8.net/0.gif?a8mat=4519B8+ASS3KQ+4EKC+631SX" alt="">

        <a href="https://px.a8.net/svt/ejp?a8mat=4519B8+BJKLSQ+14CS+6C9LD" rel="nofollow">
            <img border="0" width="120" height="60" alt="" src="https://www24.a8.net/svt/bgt?aid=250321508698&wid=002&eno=01&mid=s00000005230001065000&mc=1">
        </a>
        <img border="0" width="1" height="1" src="https://www14.a8.net/0.gif?a8mat=4519B8+BJKLSQ+14CS+6C9LD" alt="">

        <a href="https://px.a8.net/svt/ejp?a8mat=4519B8+BK61EI+5LNQ+5YJRM" rel="nofollow" class="ads-link-text">メルカリ</a>
        <img border="0" width="1" height="1" src="https://www11.a8.net/0.gif?a8mat=4519B8+BK61EI+5LNQ+5YJRM" alt="">
    </div>

    <script>
        // --- 状態 ---
        let selectedFiles = [];
        let currentDownloadUrl = null;

        // --- DOM参照 ---
        const dropZone      = document.getElementById('dropZone');
        const fileInput     = document.getElementById('pdfs');
        const chooseButton  = document.getElementById('chooseButton');
        const clearButton   = document.getElementById('clearButton');
        const mergeButton   = document.getElementById('mergeButton');
        const fileList      = document.getElementById('fileList');
        const statusMsg     = document.getElementById('statusMessage');
        const downloadSect  = document.getElementById('downloadSection');
        const downloadLink  = document.getElementById('downloadLink');
        const downloadMeta  = document.getElementById('downloadMeta');

        // --- ステータス表示 ---
        function updateStatus(message, type) {
            statusMsg.textContent = message;
            statusMsg.className = 'status-message';
            if (type === 'error')   statusMsg.classList.add('error');
            if (type === 'success') statusMsg.classList.add('success');
        }

        // --- ファイルリスト描画 ---
        function renderFileList() {
            fileList.innerHTML = '';

            if (selectedFiles.length === 0) {
                mergeButton.disabled = true;
                return;
            }

            selectedFiles.forEach(function(file, index) {
                const item = document.createElement('div');
                item.className = 'file-item';

                const meta = document.createElement('div');
                meta.className = 'file-meta';

                const nameEl = document.createElement('span');
                nameEl.className = 'file-name';
                nameEl.textContent = file.name;

                const sizeEl = document.createElement('span');
                sizeEl.className = 'file-size';
                sizeEl.textContent = (file.size / 1024).toFixed(1) + ' KB';

                meta.appendChild(nameEl);
                meta.appendChild(sizeEl);

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'remove-button';
                removeBtn.textContent = '\u2715';
                removeBtn.setAttribute('aria-label', file.name + ' を削除');
                removeBtn.addEventListener('click', (function(i) {
                    return function() {
                        selectedFiles.splice(i, 1);
                        renderFileList();
                        updateStatus('ファイルを削除しました。');
                    };
                })(index));

                item.appendChild(meta);
                item.appendChild(removeBtn);
                fileList.appendChild(item);
            });

            mergeButton.disabled = false;
        }

        // --- ファイル追加 ---
        function addFiles(fileListInput) {
            const incoming = Array.from(fileListInput)
                .filter(function(f) { return f.type === 'application/pdf'; });

            if (incoming.length !== fileListInput.length) {
                updateStatus('PDFファイル以外が含まれていたため除外しました。', 'error');
            }

            selectedFiles = selectedFiles.concat(incoming);

            if (selectedFiles.length > 20) {
                updateStatus('最大20件まで選択できます。超過分を除外しました。', 'error');
                selectedFiles = selectedFiles.slice(0, 20);
            }

            if (selectedFiles.length > 0) {
                updateStatus(selectedFiles.length + ' 件のPDFを選択しました。');
            }

            renderFileList();
        }

        // --- Blob URL解放 ---
        function revokeDownloadUrl() {
            if (currentDownloadUrl) {
                URL.revokeObjectURL(currentDownloadUrl);
                currentDownloadUrl = null;
            }
        }

        // --- イベント登録 ---
        dropZone.addEventListener('click', function() { fileInput.click(); });

        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', function() {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            addFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', function(e) {
            addFiles(e.target.files);
            fileInput.value = '';
        });

        chooseButton.addEventListener('click', function() { fileInput.click(); });

        clearButton.addEventListener('click', function() {
            selectedFiles = [];
            renderFileList();
            revokeDownloadUrl();
            downloadSect.style.display = 'none';
            updateStatus('ファイルリストをクリアしました。');
        });

        mergeButton.addEventListener('click', mergePdfs);

        // --- PDFマージ処理 ---
        async function mergePdfs() {
            if (selectedFiles.length === 0) {
                updateStatus('マージするPDFを選択してください。', 'error');
                return;
            }

            mergeButton.disabled = true;
            mergeButton.textContent = 'マージ処理中...';
            downloadSect.style.display = 'none';
            revokeDownloadUrl();
            updateStatus('PDFを読み込んでいます...');

            try {
                const { PDFDocument } = PDFLib;
                const mergedPdf = await PDFDocument.create();

                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    updateStatus('処理中: ' + (i + 1) + ' / ' + selectedFiles.length + '  (' + file.name + ')');

                    const arrayBuffer = await file.arrayBuffer();

                    let sourcePdf;
                    try {
                        sourcePdf = await PDFDocument.load(arrayBuffer);
                    } catch (loadErr) {
                        throw new Error('「' + file.name + '」の読み込みに失敗しました: ' + loadErr.message);
                    }

                    const pageIndices = sourcePdf.getPageIndices();
                    const copiedPages = await mergedPdf.copyPages(sourcePdf, pageIndices);
                    copiedPages.forEach(function(page) { mergedPdf.addPage(page); });
                }

                updateStatus('PDFを保存しています...');
                const mergedBytes = await mergedPdf.save();

                const blob = new Blob([mergedBytes], { type: 'application/pdf' });
                currentDownloadUrl = URL.createObjectURL(blob);

                const now = new Date();
                const timestamp = now.getFullYear().toString()
                    + String(now.getMonth() + 1).padStart(2, '0')
                    + String(now.getDate()).padStart(2, '0')
                    + String(now.getHours()).padStart(2, '0')
                    + String(now.getMinutes()).padStart(2, '0')
                    + String(now.getSeconds()).padStart(2, '0');
                const filename = 'merged_' + timestamp + '.pdf';

                downloadLink.href = currentDownloadUrl;
                downloadLink.download = filename;
                downloadMeta.textContent =
                    'サイズ: ' + (blob.size / 1024).toFixed(1) + ' KB  |  ' +
                    'ページ数: ' + mergedPdf.getPageCount();

                downloadSect.style.display = 'flex';
                updateStatus(
                    'マージが完了しました（' + mergedPdf.getPageCount() + ' ページ）。ダウンロードリンクから取得できます。',
                    'success'
                );

            } catch (err) {
                console.error('PDF merge error:', err);
                updateStatus('PDFマージ中にエラーが発生しました: ' + err.message, 'error');
            } finally {
                mergeButton.disabled = selectedFiles.length === 0;
                mergeButton.textContent = 'Merge PDFs';
            }
        }

        // 初期化
        renderFileList();
    </script>
</body>
</html>
